name: Finalize Membership Changes

on:
  workflow_dispatch:
    inputs:
      organization:
        description: Organization whose membership changes should be finalized
        required: true
      mode:
        description: Which potential member changes to apply
        required: true
        default: both
        type: choice
        options:
          - both
          - convert-potential-outside-collaborators
          - remove-potential-no-members
      ignore:
        description: Comma, space, or newline separated usernames to ignore
        required: false
      only:
        description: Comma, space, or newline separated usernames to target
        required: false

defaults:
  run:
    shell: bash

jobs:
  preview:
    permissions:
      contents: read
    name: Preview membership changes
    runs-on: ubuntu-latest
    outputs:
      affected-users-json: ${{ steps.preview.outputs.affected-users-json }}
    env:
      TF_WORKSPACE: ${{ github.event.inputs.organization }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pnpm
        uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
        with:
          version: 10
      - name: Use Node.js lts/*
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: ''
      - name: Initialize scripts
        run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: scripts
      - name: Preview membership changes
        id: preview
        run: node lib/actions/finalize-membership-changes.js
        working-directory: scripts
        env:
          MODE: ${{ github.event.inputs.mode }}
          IGNORE: ${{ github.event.inputs.ignore }}
          ONLY: ${{ github.event.inputs.only }}
          APPLY: 'false'

  apply:
    needs: [preview]
    if: needs.preview.outputs.affected-users-json != '[]'
    permissions:
      contents: read
    name: Apply membership changes
    runs-on: ubuntu-latest
    environment: membership-write
    env:
      GITHUB_APP_ID: ${{ secrets.RW_GITHUB_APP_ID }}
      GITHUB_APP_INSTALLATION_ID: ${{ secrets[format('RW_GITHUB_APP_INSTALLATION_ID_{0}', github.event.inputs.organization)] || secrets.RW_GITHUB_APP_INSTALLATION_ID }}
      GITHUB_APP_PEM_FILE: ${{ secrets.RW_GITHUB_APP_PEM_FILE }}
      TF_WORKSPACE: ${{ github.event.inputs.organization }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pnpm
        uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
        with:
          version: 10
      - name: Use Node.js lts/*
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: ''
      - name: Initialize scripts
        run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: scripts
      - name: Apply membership changes
        run: node lib/actions/finalize-membership-changes.js
        working-directory: scripts
        env:
          MODE: ${{ github.event.inputs.mode }}
          IGNORE: ${{ github.event.inputs.ignore }}
          ONLY: ${{ github.event.inputs.only }}
          APPLY: 'true'
